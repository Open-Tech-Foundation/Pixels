name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create tags and GitHub Releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.39.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.39.0/install.sh | bash
      - name: Expose release command
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
            cp "$(command -v otf-release)" "$RUNNER_TEMP/release-cli/release"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          fi
      - id: check
        run: |
          echo "should_release=$(release check)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.39.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.39.0/install.sh | bash
      - name: Expose release command
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
            cp "$(command -v otf-release)" "$RUNNER_TEMP/release-cli/release"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          fi
      - name: Publish
        run: release publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

