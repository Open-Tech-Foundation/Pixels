name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Every command lives in tasks.toml and runs as `tsr <task>`, so what CI does
# and what a contributor does cannot drift. The jobs here only set up what a
# task needs: toolchains, caches and system tools. `RUSTFLAGS: -D warnings`
# is set by tasks.toml for every task.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-tsr
      - run: tsr test
      - run: tsr test:doc

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-tsr
      - run: tsr fmt
      - run: tsr clippy
      - run: tsr tables

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-tsr
      - run: tsr doc

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-tsr
      - run: tsr features

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-tsr
      # The task installs 1.85 itself, so it runs the same way locally.
      - run: tsr msrv

  interop:
    name: reference interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      # libavif provides avifenc/avifdec, the independent AV1 reference the AVIF
      # fixtures are generated with. AVIF is owned outright (ADR-0013), so this
      # is a genuine cross-check against libaom, not against ourselves. aom-tools
      # provides aomenc, which encodes the super-resolution fixtures (libavif
      # does not expose aom's superres settings), and aomdec, which the AVIF
      # encoder's streams are checked against.
      - run: sudo apt-get update && sudo apt-get install -y libavif-bin aom-tools
      - uses: ./.github/actions/setup-tsr
      - run: tsr interop

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - uses: ./.github/actions/setup-tsr
      - run: tsr fuzz
