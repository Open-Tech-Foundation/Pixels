[package]
name = "otf-pixels-codec-jpeg"
description = "Baseline JPEG codec for otf-pixels, implemented from scratch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
authors.workspace = true
categories.workspace = true
# Integration tests and their data stay in the repository: they are only run
# from it, and shipping them would make every dependent download the data.
exclude = ["tests"]
keywords.workspace = true

[dependencies]
otf-pixels-core.workspace = true

[features]
default = ["progressive"]
# Deprecated, and does nothing: progressive JPEG is now decoded by this crate
# (ADR-0018) and always available. Kept so builds that name it still compile.
progressive = []

[lints]
workspace = true
