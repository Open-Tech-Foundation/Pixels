[package]
name = "otf-pixels"
description = "A streaming, demand-driven image processing engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
# Integration tests and their data stay in the repository: they are only run
# from it, and shipping them would make every dependent download the data.
exclude = ["tests"]
keywords.workspace = true
readme = "../../README.md"

[dependencies]
otf-pixels-core.workspace = true
otf-pixels-ops.workspace = true
otf-pixels-codec-raw = { workspace = true, optional = true }
otf-pixels-codec-png = { workspace = true, optional = true }
otf-pixels-codec-gif = { workspace = true, optional = true }
otf-pixels-codec-jpeg = { workspace = true, optional = true }
otf-pixels-codec-tiff = { workspace = true, optional = true }
otf-pixels-codec-webp = { workspace = true, optional = true }
otf-pixels-codec-avif = { workspace = true, optional = true }

[features]
default = ["raw", "png", "gif", "jpeg", "tiff", "webp", "avif"]
# Raw pixel codec. Kept behind a feature for symmetry with the other codecs
# (ARCHITECTURE §Layer 2: "each format is a plugin behind a cargo feature").
raw = ["dep:otf-pixels-codec-raw"]
# PNG codec, implemented from scratch including DEFLATE (ADR-0010).
png = ["dep:otf-pixels-codec-png"]
# GIF codec, including LZW (ADR-0012).
gif = ["dep:otf-pixels-codec-gif"]
# JPEG codec, baseline and progressive, including M/8 scaled decode.
jpeg = ["dep:otf-pixels-codec-jpeg"]
# Deprecated, and the same as `jpeg`: progressive decode is now part of the
# owned JPEG codec (ADR-0018). Kept so builds that name it still compile.
jpeg-progressive = ["jpeg"]
# TIFF codec. The only v1 format with region random access.
tiff = ["dep:otf-pixels-codec-tiff"]
# WebP, owned outright (ADR-0014): lossy and lossless, decode and encode.
# Encode is lossy at `quality` by default, lossless with `lossless`.
webp = ["dep:otf-pixels-codec-webp"]
# AVIF, owned outright — container and AV1 bitstream both (ADR-0013, reversing
# ADR-0004). Still images, decode and lossy encode; image sequences (`avis`)
# report `Unsupported`.
avif = ["dep:otf-pixels-codec-avif"]

[dev-dependencies]
# Benchmark comparisons only (ROADMAP M4 exit criterion). These never enter the
# published dependency graph, so the shipped library has no dependencies
# outside this workspace.
image = { version = "0.25", default-features = false }
fast_image_resize = "6"

[[bench]]
name = "ops"
harness = false

# The M5 exit criterion: giant tiled TIFF to thumbnail, against libvips.
[[bench]]
name = "thumbnail"
harness = false

# The scaling benchmark is a plain binary, not a libtest harness: it measures
# how fixed work redistributes across threads rather than timing a micro-op.
[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
