adapters = ["crates.io"]
tag_format = "{name}@{version}"
provider = "github"
default_branch = "main"
changelog_strategy = "curated"
changelog_scope = "root"
github_release_notes = "curated-changelog"

[hooks]

[publish.ignore_paths]
otf-pixels-codec-jpeg = [
    "**/*.md",
    "**/tests/**",
    "**/benches/**",
]
otf-pixels-codec-tiff = [
    "**/*.md",
    "**/tests/**",
    "**/benches/**",
]
